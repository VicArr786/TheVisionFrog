<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Commercials — The Vision Frog Productions</title>

<link rel="icon" type="image/png" href="Images/Logos/VF_Icon_3.png">
<link rel="apple-touch-icon" href="Images/Logos/VF_Icon_3.png">

<link rel="stylesheet" href="assets/css/global.css">

<style>
   @font-face {
      font-family: 'Apfel Grotezk';
      src: url('assets/fonts/ApfelGrotezk-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Apfel Grotezk';
      src: url('assets/fonts/ApfelGrotezk-Brukt.otf') format('opentype');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NHG Titles';
      src: url('assets/fonts/NHG-BoldItalic.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }


  :root {
    --bg:#000;
    --text:#f5f5f5;
    --accent:#05e205;
    --card:#151515;
    --border:#202020;
  }

  * { box-sizing:border-box; }

  /* Body uses Apfel Grotezk */
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Apfel Grotezk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
  }

  .wrap {
    max-width:1200px;
    margin:80px auto 60px;
    padding:0 16px;
  }

  /* Title uses NHG Titles */
  h1 {
    margin:0 0 16px;
    font-size:2rem;
    letter-spacing:.04em;
    font-family: 'NHG Titles', 'Apfel Grotezk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:100;
  }

  .sub { opacity:.8; margin-bottom:24px; }

  /* ------------------ BACK BUTTON ------------------ */
  .back-btn {
    position: fixed; /* Keeps it stuck to the corner even when scrolling */
    top: 20px;
    left: 20px;
    z-index: 1000;
    background: var(--accent);
    color: #081408;
    font-weight: 700;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(5,226,5,.25);
    transition: box-shadow .2s ease, transform .2s ease;
  }

  .back-btn:hover {
    box-shadow: 0 8px 25px rgba(5,226,5,.45);
    transform: translateY(-2px);
  }

  /* Grid */
  .grid {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }

  /* Image tiles */
  .item {
    position:relative;
    aspect-ratio:1/1;
    background:#0f0f0f center/cover no-repeat;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
    overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease;
    display: block; /* Ensure anchor works as block */
  }

  .item:hover {
    transform:translateY(-4px);
    box-shadow:0 16px 40px rgba(0,0,0,.45);
  }

  /* Staggering (Desktop Only) */
  .item:nth-child(2){ margin-top:34px; }
  .item:nth-child(3){ margin-top:-24px; }
  .item:nth-child(4){ margin-top:26px; }
  .item:nth-child(5){ margin-top:-18px; }
  .item:nth-child(6){ margin-top:30px; }

  /* Hover label */
  .item::after {
    content:attr(data-label);
    position:absolute;
    left:10px;
    bottom:10px;
    color:#fff;
    font-weight:700;
    letter-spacing:.02em;
    padding:.4rem .7rem;
    border-radius:8px;
    opacity:0;
    transition:opacity .2s ease;
    background: rgba(0,0,0,0.6); /* Added background for better readability */
  }

  .item:hover::after { opacity:1; }

  /* ------------------ MOBILE PORT ------------------ */
  @media (max-width:800px){
    .grid { 
      grid-template-columns:1fr; 
    }
    
    /* Remove staggering on mobile for a clean vertical list */
    .item:nth-child(n) { 
      margin-top: 0; 
    }

    /* Always show text labels on phone */
    .item::after {
      opacity: 1;
    }
  }
</style>
</head>

<body>

<a href="index.html" class="back-btn">← Back</a>

<main class="wrap">
  <h1>Commercials</h1>
  <p class="sub"></p>

  <section class="grid">
    <a class="item" href="#" data-label="Bape shoot"
       style="background-image:url('assets/images/commercials/Fredro 4.JPG');"></a>

    <a class="item" href="#" data-label="Bape shoot"
       style="background-image:url('assets/images/commercials/Fredro 12.jpg');"></a>

    <a class="item" href="#" data-label="Bape shoot"

    <a class="item" href="#" data-label="Bape shoot"
       style="background-image:url('assets/images/commercials/FRedro starr 8.jpg');"></a>

    <a class="item" href="#" data-label="Bape shoot"
       style="background-image:url('assets/images/commercials/FRedro starr Onyx 2.jpg');"></a>

    <a class="item" href="#" data-label="Bape shoot"
       style="background-image:url('assets/images/commercials/WhatsApp Image 2025-09-23 at 14.08.31.jpeg');"></a>
  </section>
</main>

</body>
</html>
